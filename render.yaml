services:
  - type: web
    name: medisync
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: ENABLE_DEMO_MODE
        value: "true"
      - key: DEMO_STAGE2_SECONDS
        value: "30"
      - key: DEMO_STAGE3_SECONDS
        value: "60"
      - key: DEMO_STAGE4_SECONDS
        value: "120"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "MediSync Healthcare <reminders@medisync.local>"
